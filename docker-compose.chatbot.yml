services:
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: restaurant-chatbot
    env_file:
      - .env.chatbot
    ports:
      - "8100:8100"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: restaurant-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
